# ============================================
#   Catch-the-eggs - Settings File
#   (Game reads/writes these automatically)
# ============================================

[display]
night_mode=0          # 0 = day, 1 = night

[gameplay]
difficulty=normal     # easy | normal | hard
time_limit=105        # in seconds (1:45 = 105)

[audio]
sound_enabled=1       # 0 = off, 1 = on
volume=80             # 0 to 100
